<details class="study-summary"{{ with .Get "id" }} id="{{ . }}"{{ end }}>
  <summary>
    <svg class="study-summary-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 5.5C9.5 3.7 6 3.3 3 4.2v15c3-.9 6.5-.5 9 1.3 2.5-1.8 6-2.2 9-1.3v-15c-3-.9-6.5-.5-9 1.3Z" />
      <path d="M12 5.5v15M6 8l3 .5M6 12l3 .5M15 8.5l3-.5M15 12.5l3-.5" />
    </svg>
    <span class="study-summary-title">{{ .Get "title" | default "知识点速记" }}</span>
    <span class="study-summary-hint" aria-hidden="true"><span class="when-closed">点击展开复习</span><span class="when-open">点击收起</span></span>
    <svg class="study-summary-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
  </summary>
  <div class="study-summary-content">
    {{ .Page.RenderString (dict "display" "block") .Inner }}
  </div>
</details>
