{{- $label := printf "表格 %d" (add .Ordinal 1) -}}
<div class="article-table">
  <p class="table-scroll-hint" hidden>左右滑动可查看完整表格</p>
  <div class="table-scroll" tabindex="0" role="region" aria-label="{{ $label }}">
    <table{{ range $k, $v := .Attributes }}{{ if $v }} {{ $k }}="{{ $v }}"{{ end }}{{ end }}>
      <thead>
        {{- range .THead }}
        <tr>{{ range . }}<th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>
        {{- end }}
      </thead>
      <tbody>
        {{- range .TBody }}
        <tr>{{ range . }}<td{{ if eq .Alignment "right" }} class="table-numeric"{{ end }}{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>
        {{- end }}
      </tbody>
    </table>
  </div>
</div>
