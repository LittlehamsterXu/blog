{{- if .IsPage }}
<div class="progress-bar" aria-hidden="true"></div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const progressBar = document.querySelector(".progress-bar");

    if (!progressBar) {
      return;
    }

    let frameRequested = false;

    function updateReadingProgress() {
      const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollableHeight > 0
        ? Math.min(100, Math.max(0, (window.scrollY / scrollableHeight) * 100))
        : 0;

      progressBar.style.width = progress + "%";
      frameRequested = false;
    }

    function requestProgressUpdate() {
      if (frameRequested) {
        return;
      }

      frameRequested = true;
      window.requestAnimationFrame(updateReadingProgress);
    }

    updateReadingProgress();
    window.addEventListener("scroll", requestProgressUpdate, { passive: true });
    window.addEventListener("resize", requestProgressUpdate, { passive: true });
  });
</script>
{{- end -}}

{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from {{ "vendor/mermaid-11.12.2/mermaid.esm.min.mjs" | relURL | jsonify | safeJS }};
  const blocks = Array.from(document.querySelectorAll("pre.mermaid"));
  const sources = blocks.map(node => node.textContent);
  let requested = false;
  let rendering = false;
  async function renderDiagrams() {
    requested = true;
    if (rendering) return;
    rendering = true;
    try {
      while (requested) {
        requested = false;
        const isDark = document.documentElement.dataset.theme === "dark";
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark ? "dark" : "default" });
        for (const [index, node] of blocks.entries()) {
          node.removeAttribute("data-processed");
          node.textContent = sources[index];
          try {
            await mermaid.run({ nodes: [node] });
            node.nextElementSibling?.classList.contains("mermaid-error") && node.nextElementSibling.remove();
          } catch (error) {
            node.textContent = sources[index];
            if (!node.nextElementSibling?.classList.contains("mermaid-error")) {
              const notice = document.createElement("p");
              notice.className = "mermaid-error";
              notice.textContent = "图表暂时无法渲染，以上保留原始内容。";
              node.after(notice);
            }
            console.error("Mermaid diagram could not be rendered", error);
          }
        }
      }
    } finally { rendering = false; }
  }
  new MutationObserver(renderDiagrams).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  renderDiagrams();
</script>
{{- end -}}

{{- if or .Params.cover.image (findRE "<img" .Content) }}
<script src="{{ "js/vendor/medium-zoom.min.js" | relURL }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const images = document.querySelectorAll(
      ".post-content img:not([data-no-zoom]), .post-single > .entry-cover img:not([data-no-zoom])"
    );

    if (!images.length || typeof mediumZoom !== "function") {
      return;
    }

    mediumZoom(images, {
      margin: 24,
      background: "rgba(15, 23, 42, .86)"
    });
  });
</script>
{{- end -}}

{{- if (.Param "ShowToc") }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const root = document.documentElement;
    const tocContainer = document.getElementById("toc-container");
    const recentPostsContainer = document.getElementById("recent-posts-container");
    let resizeFrameRequested = false;

    function checkTocPosition() {
      const rootStyle = getComputedStyle(root);
      const tocWidth = parseInt(rootStyle.getPropertyValue("--toc-width"), 10);
      const minGap = parseInt(rootStyle.getPropertyValue("--side-module-min-gap"), 10);
      const article = document.querySelector(".post-single");
      const articleWidth = article
        ? article.getBoundingClientRect().width
        : parseInt(rootStyle.getPropertyValue("--main-width"), 10);
      const viewportWidth = root.clientWidth;
      const sideGap = (viewportWidth - articleWidth - tocWidth * 2) / 4;
      const shouldWide = sideGap >= minGap;

      root.style.setProperty("--side-module-gap", `${Math.max(sideGap, minGap)}px`);

      if (tocContainer) {
        tocContainer.classList.toggle("wide", shouldWide);
      }
      if (recentPostsContainer) {
        recentPostsContainer.classList.toggle("wide", shouldWide);
      }
    }

    function requestTocPositionCheck() {
      if (resizeFrameRequested) {
        return;
      }

      resizeFrameRequested = true;
      window.requestAnimationFrame(function () {
        checkTocPosition();
        resizeFrameRequested = false;
      });
    }

    checkTocPosition();
    window.addEventListener("resize", requestTocPositionCheck, { passive: true });
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tocLinks = Array.from(document.querySelectorAll(".post-sidebar .toc a[href^='#']"));
    const headings = tocLinks
      .map(function (link) {
        const id = decodeURIComponent(link.getAttribute("href").slice(1));
        return document.getElementById(id);
      })
      .filter(Boolean);

    if (!headings.length) {
      return;
    }

    function updateActiveHeading() {
      const marker = 120;
      let activeHeading = headings[0];

      headings.forEach(function (heading) {
        if (heading.getBoundingClientRect().top <= marker) {
          activeHeading = heading;
        }
      });

      tocLinks.forEach(function (link) {
        const targetId = decodeURIComponent(link.getAttribute("href").slice(1));
        const isActive = targetId === activeHeading.id;
        link.classList.toggle("is-active", isActive);
        if (isActive) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    updateActiveHeading();
    window.addEventListener("scroll", updateActiveHeading, { passive: true });
  });
</script>
{{- end -}}
