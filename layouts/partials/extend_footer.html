{{- if .IsPage }}
<div class="progress-bar" aria-hidden="true"></div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const progressBar = document.querySelector(".progress-bar");

    if (!progressBar) {
      return;
    }

    let frameRequested = false;

    function updateReadingProgress() {
      const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollableHeight > 0
        ? Math.min(100, Math.max(0, (window.scrollY / scrollableHeight) * 100))
        : 0;

      progressBar.style.width = progress + "%";
      frameRequested = false;
    }

    function requestProgressUpdate() {
      if (frameRequested) {
        return;
      }

      frameRequested = true;
      window.requestAnimationFrame(updateReadingProgress);
    }

    updateReadingProgress();
    window.addEventListener("scroll", requestProgressUpdate, { passive: true });
    window.addEventListener("resize", requestProgressUpdate, { passive: true });
  });
</script>
{{- end -}}

{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const isDark = document.documentElement.dataset.theme === "dark";
  mermaid.initialize({
    startOnLoad: true,
    securityLevel: "strict",
    theme: isDark ? "dark" : "default"
  });
</script>
{{- end -}}

{{- if or .Params.cover.image (findRE "<img" .Content) }}
<script src="{{ "js/vendor/medium-zoom.min.js" | relURL }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const images = document.querySelectorAll(
      ".post-content img:not([data-no-zoom]), .post-single > .entry-cover img:not([data-no-zoom])"
    );

    if (!images.length || typeof mediumZoom !== "function") {
      return;
    }

    mediumZoom(images, {
      margin: 24,
      background: "rgba(15, 23, 42, .86)"
    });
  });
</script>
{{- end -}}

{{- if .Params.ShowToc }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tocLinks = Array.from(document.querySelectorAll(".post-sidebar .toc a[href^='#']"));
    const headings = tocLinks
      .map(function (link) {
        const id = decodeURIComponent(link.getAttribute("href").slice(1));
        return document.getElementById(id);
      })
      .filter(Boolean);

    if (!headings.length) {
      return;
    }

    function updateActiveHeading() {
      const marker = 120;
      let activeHeading = headings[0];

      headings.forEach(function (heading) {
        if (heading.getBoundingClientRect().top <= marker) {
          activeHeading = heading;
        }
      });

      tocLinks.forEach(function (link) {
        const targetId = decodeURIComponent(link.getAttribute("href").slice(1));
        const isActive = targetId === activeHeading.id;
        link.classList.toggle("is-active", isActive);
        if (isActive) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    updateActiveHeading();
    window.addEventListener("scroll", updateActiveHeading, { passive: true });
  });
</script>
{{- end -}}
