name: Deploy Hugo site to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HUGO_VERSION: 0.166.0

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo Extended
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Validate Cloudflare site
        run: |
          python3 -m unittest discover -s tests
          node tests/test_gemm_animation.cjs
          node tests/test_pipeline_model.cjs
          bash scripts/build-cloudflare.sh "$RUNNER_TEMP/blog-cloudflare"

      - name: Build and validate GitHub Pages site
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          pages_url="https://${OWNER}.github.io/${REPOSITORY}/"
          if [ "${REPOSITORY,,}" = "${OWNER,,}.github.io" ]; then
            pages_url="https://${OWNER}.github.io/"
          fi
          hugo --gc --minify -b "$pages_url"
          python3 scripts/check-site.py public --base-url "$pages_url"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
