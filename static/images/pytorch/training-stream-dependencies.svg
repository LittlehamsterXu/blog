<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">把依赖接到另一条 Stream</title>
<desc id="desc">三条stream泳道示意，仅表示依赖关系，横向位置不表示真实时间，也不展示测得的并行重叠。default stream准备a、b，s1先执行s1.wait_stream(default)，再计算c等于a矩阵乘b；s2先执行s2.wait_stream(s1)，再计算d等于c加1；最后default stream执行default.wait_stream(s2)，再使用d。每次wait_stream使接收stream中后续工作等待来源stream已提交工作完成。record_stream管理张量存储的allocator寿命，不建立执行依赖。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#706760"/></marker></defs>
<rect width="1000" height="420" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">把依赖接到另一条 Stream</text>
<text x="30" y="81" font-size="23" fill="#706760" text-anchor="start" class="">箭头只表示依赖关系；横向位置不代表真实时间。</text>
<text x="112" y="146" font-size="23" fill="#706760" text-anchor="end" class="mono">default</text>
<line x1="127" y1="138" x2="970" y2="138" stroke="#d9cec3" stroke-width="1.5"/>
<text x="112" y="239" font-size="23" fill="#706760" text-anchor="end" class="mono">s1</text>
<line x1="127" y1="231" x2="970" y2="231" stroke="#d9cec3" stroke-width="1.5"/>
<text x="112" y="332" font-size="23" fill="#706760" text-anchor="end" class="mono">s2</text>
<line x1="127" y1="324" x2="970" y2="324" stroke="#d9cec3" stroke-width="1.5"/>
<rect x="130" y="111" width="150" height="54" rx="8" fill="#fae4da" stroke="#e18568" stroke-width="1.5"/>
<text x="205.0" y="146" font-size="23" fill="#e18568" text-anchor="middle" class="bold">① 准备 a、b</text>
<rect x="344" y="204" width="172" height="54" rx="8" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/>
<text x="430.0" y="239" font-size="23" fill="#427e9a" text-anchor="middle" class="bold">② c = a @ b</text>
<rect x="574" y="297" width="172" height="54" rx="8" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/>
<text x="660.0" y="332" font-size="23" fill="#4c8164" text-anchor="middle" class="bold">③ d = c + 1</text>
<rect x="803" y="111" width="167" height="54" rx="8" fill="#fae4da" stroke="#e18568" stroke-width="1.5"/>
<text x="886.5" y="146" font-size="23" fill="#e18568" text-anchor="middle" class="bold">④ 使用 d</text>
<line x1="280" y1="146" x2="334" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="516" y1="239" x2="564" y2="313" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="746" y1="317" x2="793" y2="152" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="151.0" y="166" width="298" height="33" rx="5" fill="#fbf7f0" stroke="#fbf7f0" stroke-width="0"/>
<text x="300" y="190" font-size="22" fill="#706760" text-anchor="middle" class="mono">s1.wait_stream(default)</text>
<rect x="426.0" y="259" width="244" height="33" rx="5" fill="#fbf7f0" stroke="#fbf7f0" stroke-width="0"/>
<text x="548" y="283" font-size="22" fill="#706760" text-anchor="middle" class="mono">s2.wait_stream(s1)</text>
<rect x="661.0" y="214" width="298" height="33" rx="5" fill="#fbf7f0" stroke="#fbf7f0" stroke-width="0"/>
<text x="810" y="238" font-size="22" fill="#706760" text-anchor="middle" class="mono">default.wait_stream(s2)</text>
<line x1="30" y1="370" x2="970" y2="370" stroke="#d9cec3" stroke-width="1.5"/>
<text x="500" y="407" font-size="23" fill="#302c2a" text-anchor="middle" class="">record_stream 管 allocator 的内存寿命，不建立执行依赖。</text>
</svg>
