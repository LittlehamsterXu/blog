<defs><linearGradient id="gray-wash" x2="0" y2="1"><stop stop-color="#eef1f4"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
<text x="32" y="56" font-size="40" fill="#253444" text-anchor="start" font-weight="650">Prefix Caching：相同的完整前缀块，第二次直接复用</text>
<text x="32" y="100" font-size="26" fill="#697887" text-anchor="start" font-weight="400">Block Size = 4。先处理 A，再处理 B；前 8 个 Token 相同，后缀从第 3 块开始分开。</text>
