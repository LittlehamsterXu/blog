<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Prefix Caching：相同的完整前缀块，第二次直接复用</title><desc id="desc">前缀缓存模拟器的真实Token示例。请求A有11个Token，请解释KVCache工作原理以及例子先讲原理；请求B有12个Token，前8个相同，末4个是再比较GQAMLA。A将两个完整块登记为P0和P1，尾部3个Token不登记为可复用块。B命中前两块，第三个完整块新登记为P2。父块哈希与当前块Token共同决定当前块哈希。右下物理视图中A和B共同引用P0和P1，B新增P2。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}</style>
<defs><linearGradient id="page" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#fffaf4"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#536578" flood-opacity=".08"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 9 4.5 0 9Z" fill="context-stroke"/></marker></defs>
<rect width="1440" height="810" rx="22" fill="url(#page)"/>
<defs><linearGradient id="blue-wash" x2="0" y2="1"><stop stop-color="#e9f4fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
