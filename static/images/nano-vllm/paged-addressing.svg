<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140" role="img" aria-labelledby="title desc"><title id="title">位置9如何落到物理槽17</title><desc id="desc">完整的8块物理缓存池，每块4槽。A的逻辑位置0到9映射到物理块2、7、4。位置9是本轮新KV，写入物理块4偏移1即槽17；Attention只读取这10个有效位置，不读取尾块的两个空位。</desc>
