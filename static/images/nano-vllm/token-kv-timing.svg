<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1210" viewBox="0 0 1500 1210" role="img" aria-labelledby="title desc"><title id="title">同一个 Token，先被采样，再写入 KV</title><desc id="desc">三个位置对齐的状态带显示序列与KV的不同长度。Prefill处理ABC后采样D；D沿箭头进入下一轮并写入自己的KV；E重复这一过程。下方因果矩阵展示Q_D读取K_A到K_D，再对对应V加权求和。</desc>
