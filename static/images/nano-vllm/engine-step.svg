<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">两条请求的一轮 Decode</title><desc id="desc">三阶段从左到右。Scheduler 选中请求1和请求2。ModelRunner 以 batch=2 的一次模型调用分别输入 D、Y，两行各自读取历史 ABC、X，在模型执行中写入 D、Y 的 KV，形成 ABCD、XY，再分别采样 E、Z。postprocess 将 cached 计数从3、1更新为4、2，并把 E、Z 追加到各自序列。新采样 E、Z 的 KV 留待下一轮计算。两条请求始终处于独立的行。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}</style><defs><linearGradient id="page" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#fffaf4"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1000" rx="22" fill="url(#page)"/>
<text x="32" y="57" font-size="42" fill="#253444" font-weight="650" text-anchor="start">两条请求的一轮 Decode</text>
<text x="32" y="105" font-size="29" fill="#697887" font-weight="400" text-anchor="start">同一次 step，两条独立序列各生成一个新 Token。</text>
<text x="55" y="175" font-size="36" fill="#2f7aa0" font-weight="650" text-anchor="start">① 选请求</text>
<text x="55" y="218" font-size="28" fill="#697887" font-weight="400" text-anchor="start">Scheduler</text>
<text x="540" y="175" font-size="36" fill="#2f7aa0" font-weight="650" text-anchor="start">② 组批执行</text>
<text x="540" y="218" font-size="28" fill="#697887" font-weight="400" text-anchor="start">ModelRunner</text>
<text x="1160" y="175" font-size="36" fill="#2f7aa0" font-weight="650" text-anchor="start">③ 更新序列</text>
<text x="1160" y="218" font-size="28" fill="#697887" font-weight="400" text-anchor="start">postprocess</text>
