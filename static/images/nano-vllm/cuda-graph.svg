<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">CUDA Graph 的捕获与重放</title><desc id="desc">示意两次 Decode 的模型主干片段。Eager 在 CPU 为每个 Kernel 分别 launch，CUDA Graph 为捕获好的相同 Kernel 链每轮调用一次 replay。图中抽取五个 Kernel，用 K1 到 K5 表示；真实模型主干包含更多 Kernel。固定地址缓冲区的 input_ids 内容 D到E、position内容3到4。教学块大小为4，进入位置4时新增物理块7，块表缓冲区从首列2扩展为有效列2和7，缓冲区地址保持不变。图读取新内容重新计算，logits与采样在模型捕获图外。图宽度和间隔不表示耗时，本地实验使用 eager，Graph来自源码。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}</style><defs><linearGradient id="page" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#fffaf4"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs><rect width="1600" height="1040" rx="22" fill="url(#page)"/>
