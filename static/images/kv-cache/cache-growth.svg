<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">KV Cache 的容量：把每层的两张历史表加起来</title>
<desc id="desc">左侧画模型多层堆叠，每层包含Key和Value两个三维缓存，三维分别为KV Heads、历史Token数S、Head宽度dh。右侧在32层单序列8192上下文32Query Heads与BF16下比较32、8、1个KV Heads对应4GiB、1GiB、128MiB。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}</style>
<defs><linearGradient id="page" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#fffaf4"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#536578" flood-opacity=".09"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1440" height="810" rx="22" fill="url(#page)"/>
<defs><linearGradient id="blue-wash" x2="0" y2="1"><stop stop-color="#e9f4fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
