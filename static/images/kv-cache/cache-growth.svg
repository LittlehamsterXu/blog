<text x="32" y="56" font-size="40" fill="#253444" text-anchor="start" font-weight="650">KV Cache 的容量：把每层的两张历史表加起来</text>
<text x="32" y="100" font-size="26" fill="#697887" text-anchor="start" font-weight="400">缓存中的每一个数都要占字节；层数、序列数、历史长度与 KV Heads 一起决定总量。</text>
