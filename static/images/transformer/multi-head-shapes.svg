<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Multi-Head：拆开维度，也要按原顺序合回去</title>
<desc id="desc">示例B为2、T为3、D为4，两个Head，每个Head宽度2。投影后的QKV形状2乘3乘4，reshape为2乘3乘2乘2，再transpose第1和2维为2乘2乘3乘2。各Head Attention后context保持这一形状。合并时先transpose回2乘3乘2乘2，再reshape成2乘3乘4并经过输出投影，不能省略换回维度。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">Multi-Head：拆开维度，也要按原顺序合回去</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">示例：B = 2，T = 3，D = 4，H = 2，每个 Head 的宽度 d = 2。</text>
<text x="30" y="123" font-size="23" fill="#427e9a" text-anchor="start" class="bold">拆分 Head</text><rect x="30" y="142" width="250" height="88" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="155.0" y="177.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">Q / K / V 投影</text><text x="155.0" y="211.0" font-size="22" fill="#302c2a" text-anchor="middle">[2,3,4]</text><rect x="375" y="142" width="250" height="88" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="500.0" y="177.0" font-size="22" fill="#8668a5" text-anchor="middle" class="bold">reshape(B,T,H,d)</text><text x="500.0" y="211.0" font-size="24" fill="#302c2a" text-anchor="middle">[2,3,2,2]</text><rect x="720" y="142" width="250" height="88" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="845.0" y="177.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">transpose(1,2)</text><text x="845.0" y="211.0" font-size="24" fill="#302c2a" text-anchor="middle">[2,2,3,2]</text><line x1="290" y1="186" x2="362" y2="186" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="635" y1="186" x2="707" y2="186" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="270" font-size="23" fill="#706760" text-anchor="middle">每个 Head 独立计算 Attention，context 的维度仍是 [B,H,T,d]。</text><text x="30" y="308" font-size="23" fill="#4c8164" text-anchor="start" class="bold">合并 Head</text><rect x="30" y="326" width="250" height="88" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="155.0" y="361.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">context = A @ V</text><text x="155.0" y="395.0" font-size="24" fill="#302c2a" text-anchor="middle">[2,2,3,2]</text><rect x="375" y="326" width="250" height="88" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="500.0" y="361.0" font-size="23" fill="#8668a5" text-anchor="middle" class="bold">transpose(1,2)</text><text x="500.0" y="395.0" font-size="24" fill="#302c2a" text-anchor="middle">[2,3,2,2]</text><rect x="720" y="326" width="250" height="88" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="845.0" y="361.0" font-size="22" fill="#4c8164" text-anchor="middle" class="bold">reshape + out_proj</text><text x="845.0" y="395.0" font-size="24" fill="#302c2a" text-anchor="middle">[2,3,4]</text><line x1="290" y1="370" x2="362" y2="370" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="635" y1="370" x2="707" y2="370" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="448" font-size="23" fill="#706760" text-anchor="middle">合并前先换回 T、H 两个维度，再把 H × d 展平。</text>
</svg>
