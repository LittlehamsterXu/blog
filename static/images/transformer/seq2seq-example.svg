<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Seq2Seq Transformer：按实验代码改绘的经典双塔结构</title>
<desc id="desc">参考Attention Is All You Need论文Figure 1的经典左Encoder右Decoder双塔布局，按seq2seq_transformer.py实验改绘：宽度32，4个Head，FFN宽度64，GELU激活，Encoder和Decoder分别堆叠两层。图按自下而上读取。源和右移目标使用各自独立的Token Embedding和可学习绝对位置嵌入，经过圆形加号相加。Encoder每层依次Self-Attention、Add and Norm、FFN、Add and Norm，Self-Attention屏蔽源PAD Key。Decoder每层依次Masked Self-Attention、Add and Norm、Cross-Attention、Add and Norm、FFN、Add and Norm；Self-Attention使用因果Mask与目标PAD Key Mask；Cross-Attention的Query来自下方Decoder表示，Key和Value来自最终Encoder Memory，并屏蔽源PAD Key。每一子层均明确画出绕行至Add and Norm的残差连接，顺序为Post-LayerNorm。最终Encoder Memory形状1乘5乘32。Decoder栈外还有源码的final_norm，然后经过Linear产生1乘6乘15的Logits；训练直接计算忽略PAD标签的交叉熵，无额外Softmax层。此图不复刻原论文的六层、正弦位置编码或ReLU参数配置。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6Z" fill="#706760"/></marker></defs>
<rect width="1500" height="760" rx="20" fill="#fbf7f0"/>
<text x="30" y="44" font-size="34" fill="#302c2a" text-anchor="start" class="bold">Seq2Seq Transformer：完整双塔结构</text><text x="30" y="86" font-size="26" fill="#706760" text-anchor="start">D = 32 · H = 4 · d_ff = 64 · Post-LN</text><text x="30" y="135" font-size="26" fill="#706760" text-anchor="start">参考论文 Fig. 1，按本次代码改绘。</text><text x="30" y="173" font-size="26" fill="#706760" text-anchor="start">自下而上；训练将 Logits 直接交给 CE。</text><g id="encoder-stack" aria-label="两层Encoder；各子层先残差相加，再LayerNorm"><rect x="190" y="358" width="415" height="258" rx="20" fill="#f5f0e9" stroke="#b7aa9d" stroke-width="2"/><text x="92" y="455" font-size="30" fill="#706760" text-anchor="middle" class="bold">Encoder</text><text x="92" y="495" font-size="32" fill="#706760" text-anchor="middle" class="bold">× 2</text><path d="M400 611 H216 V510 H245" fill="none" stroke="#706760" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="400" cy="611" r="4" fill="#706760"/><path d="M400 488 H216 V394 H245" fill="none" stroke="#706760" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="400" cy="488" r="4" fill="#706760"/><line x1="400" y1="623" x2="400" y2="596" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="400" y1="548" x2="400" y2="530" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="400" y1="490" x2="400" y2="480" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="400" y1="432" x2="400" y2="414" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="245" y="548" width="310" height="48" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.8"/><text x="400.0" y="583.0" font-size="30" fill="#427e9a" text-anchor="middle" class="bold">Self-Attention</text><rect x="245" y="490" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="400.0" y="521.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">Add &amp; Norm</text><rect x="245" y="432" width="310" height="48" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.8"/><text x="400.0" y="467.0" font-size="30" fill="#4c8164" text-anchor="middle" class="bold">FFN · GELU</text><rect x="245" y="374" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="400.0" y="405.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">Add &amp; Norm</text><text x="88" y="574" font-size="26" fill="#427e9a" text-anchor="middle">源 PAD</text></g><g id="encoder-memory" aria-label="最终Encoder输出；供每层Decoder Cross-Attention投影为Key和Value"><line x1="400" y1="374" x2="400" y2="344" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="245" y="300" width="310" height="44" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.8"/><text x="400.0" y="333.0" font-size="26" fill="#4c8164" text-anchor="middle" class="bold">memory [1,5,32]</text><text x="811" y="417" font-size="26" fill="#4c8164" text-anchor="middle" class="bold">K、V</text></g><g id="decoder-stack" aria-label="两层Decoder；Masked Self-Attention、Cross-Attention与FFN各有残差并随后LayerNorm"><rect x="850" y="205" width="430" height="411" rx="20" fill="#f5f0e9" stroke="#b7aa9d" stroke-width="2"/><text x="1380" y="294" font-size="30" fill="#706760" text-anchor="middle" class="bold">Decoder</text><text x="1380" y="334" font-size="32" fill="#706760" text-anchor="middle" class="bold">× 2</text><path d="M1060 611 H1248 V508 H1215" fill="none" stroke="#706760" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1060" cy="611" r="4" fill="#706760"/><path d="M1060 474 H1248 V368 H1215" fill="none" stroke="#706760" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1060" cy="474" r="4" fill="#706760"/><path d="M1060 338 H1248 V240 H1215" fill="none" stroke="#706760" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="1060" cy="338" r="4" fill="#706760"/><line x1="1060" y1="623" x2="1060" y2="596" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="548" x2="1060" y2="528" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="488" x2="1060" y2="456" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="408" x2="1060" y2="388" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="348" x2="1060" y2="328" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="280" x2="1060" y2="260" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="905" y="548" width="310" height="48" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.8"/><text x="1060.0" y="583.0" font-size="30" fill="#bf633f" text-anchor="middle" class="bold">Masked Self-MHA</text><rect x="905" y="488" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="1060.0" y="519.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">Add &amp; Norm</text><rect x="905" y="408" width="310" height="48" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.8"/><text x="1060.0" y="443.0" font-size="30" fill="#427e9a" text-anchor="middle" class="bold">Cross-Attention</text><rect x="905" y="348" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="1060.0" y="379.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">Add &amp; Norm</text><rect x="905" y="280" width="310" height="48" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.8"/><text x="1060.0" y="315.0" font-size="30" fill="#4c8164" text-anchor="middle" class="bold">FFN · GELU</text><rect x="905" y="220" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="1060.0" y="251.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">Add &amp; Norm</text><text x="1370" y="440" font-size="26" fill="#427e9a" text-anchor="middle">源 PAD</text><text x="1370" y="578" font-size="26" fill="#bf633f" text-anchor="middle">因果 + 目标 PAD</text><text x="875" y="482" font-size="26" fill="#427e9a" text-anchor="middle" class="bold">Q</text><line x1="897" y1="474" x2="1048" y2="474" stroke="#427e9a" stroke-width="2.5"/></g><g id="vocabulary-output" aria-label="Decoder栈外先final_norm，再Linear投影为词表Logits；训练直接计算交叉熵"><line x1="1060" y1="220" x2="1060" y2="200" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="160" x2="1060" y2="140" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="100" x2="1060" y2="82" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="905" y="160" width="310" height="40" rx="9" fill="#f3edcf" stroke="#9d8b4e" stroke-width="1.8"/><text x="1060.0" y="191.0" font-size="30" fill="#9d8b4e" text-anchor="middle" class="bold">final_norm</text><rect x="905" y="100" width="310" height="40" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.8"/><text x="1060.0" y="131.0" font-size="28" fill="#8668a5" text-anchor="middle" class="bold">Linear · 32 → 15</text><rect x="905" y="38" width="310" height="44" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.8"/><text x="1060.0" y="71.0" font-size="28" fill="#bf633f" text-anchor="middle" class="bold">Logits [1,6,15]</text><path d="M1215 60 H1290 V126 H1325" fill="none" stroke="#bf633f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1325" y="89" width="155" height="74" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.8"/><text x="1402.5" y="120" font-size="30" fill="#8668a5" text-anchor="middle" class="bold">CE</text><text x="1402.5" y="150" font-size="24" fill="#302c2a" text-anchor="middle">ignore PAD</text><text x="1402" y="199" font-size="26" fill="#8668a5" text-anchor="middle">标签</text><line x1="1402" y1="174" x2="1402" y2="163" stroke="#8668a5" stroke-width="2.5" marker-end="url(#arrow)"/></g><g id="source-embedding" aria-label="独立的源Token Embedding与可学习绝对位置嵌入相加"><rect x="245" y="678" width="310" height="44" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.8"/><text x="400.0" y="711.0" font-size="28" fill="#bf633f" text-anchor="middle" class="bold">Token Embedding</text><rect x="30" y="620" width="210" height="42" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.8"/><text x="135.0" y="652.0" font-size="24" fill="#8668a5" text-anchor="middle" class="bold">Learned Position</text><line x1="240" y1="641" x2="382" y2="641" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="400" y1="678" x2="400" y2="659" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="400" cy="641" r="18" fill="#fbf7f0" stroke="#706760" stroke-width="2"/><text x="400" y="651" font-size="32" fill="#706760" text-anchor="middle">+</text><text x="400" y="752" font-size="28" fill="#706760" text-anchor="middle">Source IDs [1,5]</text><line x1="400" y1="728" x2="400" y2="722" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/></g><g id="target-embedding" aria-label="独立的目标Token Embedding与可学习绝对位置嵌入相加；目标已右移"><rect x="905" y="678" width="310" height="44" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.8"/><text x="1060.0" y="711.0" font-size="28" fill="#bf633f" text-anchor="middle" class="bold">Token Embedding</text><rect x="1270" y="620" width="210" height="42" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.8"/><text x="1375.0" y="652.0" font-size="24" fill="#8668a5" text-anchor="middle" class="bold">Learned Position</text><line x1="1270" y1="641" x2="1078" y2="641" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1060" y1="678" x2="1060" y2="659" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="1060" cy="641" r="18" fill="#fbf7f0" stroke="#706760" stroke-width="2"/><text x="1060" y="651" font-size="32" fill="#706760" text-anchor="middle">+</text><text x="1060" y="752" font-size="28" fill="#706760" text-anchor="middle">Shifted Targets [1,6]</text><line x1="1060" y1="728" x2="1060" y2="722" stroke="#706760" stroke-width="2.5" marker-end="url(#arrow)"/></g><path d="M555 322 H720 V432 H905" fill="none" stroke="#4c8164" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
