<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Encoder Block：Attention 与 FFN 怎样接起来</title>
<desc id="desc">实验Encoder采用Post-LayerNorm。第一子层先Self-Attention，再与原输入做残差相加，然后LayerNorm。第二子层对每个位置应用同一套16到64到16的MLP，再加残差，最后LayerNorm。Attention交换不同Token的信息，FFN逐位置变换特征。所有主干张量形状均为B乘T乘16。为清楚显示依赖省略Dropout。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="460" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">Encoder Block：Attention 与 FFN 怎样接起来</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">Post-LN：先加残差，再做 LayerNorm。图中省略 Dropout。</text>
<path d="M60 225 V135 H280 V199" fill="none" stroke="#706760" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M500 225 V135 H755 V199" fill="none" stroke="#706760" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="170" y="123" font-size="23" fill="#706760" text-anchor="middle">残差</text><text x="630" y="123" font-size="23" fill="#706760" text-anchor="middle">残差</text><rect x="100" y="180" width="145" height="90" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="172.5" y="216.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">Self-Attn</text><text x="172.5" y="250.0" font-size="23" fill="#302c2a" text-anchor="middle">跨 Token</text><rect x="325" y="180" width="155" height="90" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="402.5" y="233.0" font-size="23" fill="#8668a5" text-anchor="middle" class="bold">LayerNorm</text><rect x="535" y="180" width="175" height="90" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="622.5" y="216.0" font-size="25" fill="#4c8164" text-anchor="middle" class="bold">FFN</text><text x="622.5" y="250.0" font-size="22" fill="#302c2a" text-anchor="middle">16 → 64 → 16</text><rect x="805" y="180" width="165" height="90" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="887.5" y="233.0" font-size="23" fill="#8668a5" text-anchor="middle" class="bold">LayerNorm</text><circle cx="280" cy="225" r="21" fill="#fbf7f0" stroke="#706760" stroke-width="2"/><text x="280" y="233" font-size="30" fill="#706760" text-anchor="middle">+</text><circle cx="755" cy="225" r="21" fill="#fbf7f0" stroke="#706760" stroke-width="2"/><text x="755" y="233" font-size="30" fill="#706760" text-anchor="middle">+</text><line x1="30" y1="225" x2="90" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="245" y1="225" x2="251" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="309" y1="225" x2="315" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="225" x2="525" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="710" y1="225" x2="726" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="784" y1="225" x2="795" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="970" y1="225" x2="990" y2="225" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="177" y="318" font-size="23" fill="#427e9a" text-anchor="middle">不同位置之间交换信息</text><text x="622" y="318" font-size="23" fill="#4c8164" text-anchor="middle">每个位置使用同一套 MLP</text><line x1="30" y1="343" x2="970" y2="343" stroke="#d9cec3" stroke-width="2"/><text x="250" y="386" font-size="24" fill="#302c2a" text-anchor="middle">x₁ = LN(x + Attention(x))</text><text x="750" y="386" font-size="24" fill="#302c2a" text-anchor="middle">x₂ = LN(x₁ + FFN(x₁))</text><text x="500" y="435" font-size="23" fill="#706760" text-anchor="middle">主干形状始终是 [B,T,16]；FFN 的 64 只存在于中间层。</text>
</svg>
