<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">原始 Transformer 的 Encoder–Decoder</title>
<desc id="desc">原始Encoder-Decoder结构的横向概览。源序列加词嵌入与位置表示后，经过N层Encoder得到Memory。右移目标加词与位置嵌入后，先经过Masked Self-Attention，再用Decoder的Query对Encoder Memory投影得到的Key和Value做Cross-Attention，随后经过FFN。三种子层组成Decoder层，堆叠N层后，经分组外的Linear投影为词表Logits。此图省略各子层的残差与LayerNorm。前面的独立实验实现六层Encoder，并单独验证Cross-Attention；TinyDecoder不含Cross-Attention，文末Seq2Seq案例再把两侧连接。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">原始 Transformer 的 Encoder–Decoder</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">Encoder 编码源序列；Decoder 用自己的 Query，读取 Encoder 的 Key、Value。</text>
<rect x="30" y="135" width="150" height="90" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="105.0" y="171.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">源序列</text><text x="105.0" y="205.0" font-size="22" fill="#302c2a" text-anchor="middle">Token IDs</text><rect x="220" y="135" width="220" height="90" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="330.0" y="171.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">Embedding</text><text x="330.0" y="205.0" font-size="22" fill="#302c2a" text-anchor="middle">+ Position</text><rect x="480" y="135" width="220" height="90" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="590.0" y="171.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">Encoder × N</text><text x="590.0" y="205.0" font-size="22" fill="#302c2a" text-anchor="middle">实验：6 层</text><rect x="740" y="135" width="230" height="90" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="855.0" y="171.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">Memory</text><text x="855.0" y="205.0" font-size="22" fill="#302c2a" text-anchor="middle">[B,T_enc,D]</text><line x1="180" y1="180" x2="210" y2="180" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="180" x2="470" y2="180" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="700" y1="180" x2="730" y2="180" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><path d="M855 225 V277 H552 V305" fill="none" stroke="#4c8164" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="743" y="263" font-size="23" fill="#4c8164" text-anchor="middle">K、V 来自 Encoder</text><rect x="210" y="305" width="620" height="111" rx="12" fill="none" stroke="#b7aa9d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="330" y="291" font-size="23" fill="#706760" text-anchor="middle" class="bold">Decoder × N</text><rect x="30" y="315" width="150" height="90" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="105.0" y="351.0" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">右移目标</text><text x="105.0" y="385.0" font-size="22" fill="#302c2a" text-anchor="middle">词与位置嵌入</text><rect x="220" y="315" width="185" height="90" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="312.5" y="351.0" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">Masked</text><text x="312.5" y="385.0" font-size="22" fill="#302c2a" text-anchor="middle">Self-Attention</text><rect x="445" y="315" width="215" height="90" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="552.5" y="351.0" font-size="23" fill="#8668a5" text-anchor="middle" class="bold">Cross-Attention</text><text x="552.5" y="385.0" font-size="22" fill="#302c2a" text-anchor="middle">独立验证</text><rect x="700" y="315" width="120" height="90" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="760.0" y="368.0" font-size="25" fill="#4c8164" text-anchor="middle" class="bold">FFN</text><rect x="860" y="315" width="110" height="90" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="915.0" y="351.0" font-size="22" fill="#bf633f" text-anchor="middle" class="bold">Linear</text><text x="915.0" y="385.0" font-size="22" fill="#302c2a" text-anchor="middle">Logits</text><line x1="180" y1="360" x2="210" y2="360" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="405" y1="360" x2="435" y2="360" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="660" y1="360" x2="690" y2="360" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="820" y1="360" x2="850" y2="360" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="342" font-size="22" fill="#8668a5" text-anchor="middle" class="bold">Q</text><text x="500" y="448" font-size="22" fill="#706760" text-anchor="middle">省略各子层的残差与 LN；前面的 TinyDecoder 没有 Cross-Attention。</text>
</svg>
