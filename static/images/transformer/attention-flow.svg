<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Attention：先算权重，再汇总 Value</title>
<desc id="desc">单头注意力。Q与K的形状为B乘T乘dk，QK转置生成B乘T乘T的分数，先除以根号dk并加入可选Mask，再沿Key维度Softmax生成权重A。A的形状是B乘T乘T；A乘V后才得到B乘T乘dv的输出。权重和输出是两个不同张量。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="460" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">Attention：先算权重，再汇总 Value</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">同一个 Query 与所有 Key 比较，得到一行权重，再用它们加权 V。</text>
<rect x="30" y="150" width="145" height="110" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="102.5" y="196.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">Q、K</text><text x="102.5" y="230.0" font-size="22" fill="#302c2a" text-anchor="middle">[B,T,dₖ]</text><rect x="215" y="150" width="145" height="110" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="287.5" y="196.0" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">QKᵀ</text><text x="287.5" y="230.0" font-size="22" fill="#302c2a" text-anchor="middle">[B,T,T]</text><rect x="400" y="150" width="175" height="110" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="487.5" y="196.0" font-size="24" fill="#8668a5" text-anchor="middle" class="bold">÷ √dₖ</text><text x="487.5" y="230.0" font-size="22" fill="#302c2a" text-anchor="middle">+ Mask</text><rect x="615" y="150" width="160" height="110" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="695.0" y="196.0" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">Softmax</text><text x="695.0" y="230.0" font-size="22" fill="#302c2a" text-anchor="middle">A [B,T,T]</text><rect x="815" y="150" width="155" height="110" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="892.5" y="196.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">A @ V</text><text x="892.5" y="230.0" font-size="22" fill="#302c2a" text-anchor="middle">[B,T,dᵥ]</text><line x1="175" y1="205" x2="205" y2="205" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="360" y1="205" x2="390" y2="205" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="575" y1="205" x2="605" y2="205" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="775" y1="205" x2="805" y2="205" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="132" font-size="22" fill="#bf633f" text-anchor="middle">dim = −1</text><text x="695" y="296" font-size="25" fill="#bf633f" text-anchor="middle" class="bold">权重</text><text x="892" y="132" font-size="25" fill="#4c8164" text-anchor="middle" class="bold">输出</text><rect x="815" y="332" width="155" height="65" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="892.5" y="372.5" font-size="22" fill="#427e9a" text-anchor="middle" class="bold">V [B,T,dᵥ]</text><line x1="892" y1="322" x2="892" y2="272" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="346" font-size="23" fill="#302c2a" text-anchor="start">A 的一行：当前 Query 给各个 Key 分配多少权重。</text><text x="30" y="384" font-size="23" fill="#302c2a" text-anchor="start">A @ V 的一行：把这些 Value 加权后得到的特征。</text><text x="500" y="437" font-size="23" fill="#706760" text-anchor="middle">权重的最后一维是 Key 位置；输出的最后一维是 Value 特征。</text>
</svg>
