<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Teacher Forcing：输入与标签错开一个位置</title>
<desc id="desc">左侧展示第一个样本，完整序列为BOS A B C EOS。Decoder输入为BOS A B C，监督标签为A B C EOS，每个输入位置预测下一个Token。计算全部位置时仍使用Causal Mask。两个样本组成batch，TinyDecoder输出Logits形状2乘4乘6，reshape为8乘6，标签由2乘4展平成8，交叉熵生成标量loss，然后反向传播并更新参数。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">Teacher Forcing：输入与标签错开一个位置</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">一次送入四个位置，每个位置只根据已有前缀，预测下一个 Token。</text>
<text x="30" y="164" font-size="24" fill="#427e9a" text-anchor="start" class="bold">输入</text><text x="30" y="268" font-size="24" fill="#bf633f" text-anchor="start" class="bold">标签</text><rect x="160" y="127" width="65" height="58" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="192.5" y="164.0" font-size="23" fill="#427e9a" text-anchor="middle" class="bold">BOS</text><rect x="160" y="231" width="65" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="192.5" y="268.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">A</text><line x1="192.5" y1="195" x2="192.5" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="127" width="65" height="58" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="277.5" y="164.0" font-size="23" fill="#427e9a" text-anchor="middle" class="bold">A</text><rect x="245" y="231" width="65" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="277.5" y="268.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">B</text><line x1="277.5" y1="195" x2="277.5" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="127" width="65" height="58" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="362.5" y="164.0" font-size="23" fill="#427e9a" text-anchor="middle" class="bold">B</text><rect x="330" y="231" width="65" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="362.5" y="268.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">C</text><line x1="362.5" y1="195" x2="362.5" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="127" width="65" height="58" rx="9" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.5"/><text x="447.5" y="164.0" font-size="23" fill="#427e9a" text-anchor="middle" class="bold">C</text><rect x="415" y="231" width="65" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="447.5" y="268.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">EOS</text><line x1="447.5" y1="195" x2="447.5" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="488" y1="156" x2="548" y2="156" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="488" y1="260" x2="548" y2="260" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="117" width="200" height="78" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="660.0" y="147.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">TinyDecoder</text><text x="660.0" y="181.0" font-size="22" fill="#302c2a" text-anchor="middle">logits [2,4,6]</text><rect x="560" y="231" width="200" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="660.0" y="268.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">targets [2,4]</text><rect x="810" y="117" width="160" height="78" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="890.0" y="147.0" font-size="22" fill="#4c8164" text-anchor="middle" class="bold">reshape</text><text x="890.0" y="181.0" font-size="25" fill="#302c2a" text-anchor="middle">[8,6]</text><rect x="810" y="231" width="160" height="58" rx="9" fill="#fae4da" stroke="#bf633f" stroke-width="1.5"/><text x="890.0" y="268.0" font-size="25" fill="#bf633f" text-anchor="middle" class="bold">[8]</text><line x1="770" y1="156" x2="800" y2="156" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="770" y1="260" x2="800" y2="260" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><path d="M970 156 H985 V324 H940 V338" fill="none" stroke="#706760" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="890" y1="289" x2="890" y2="338" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="348" width="160" height="64" rx="9" fill="#eee7f4" stroke="#8668a5" stroke-width="1.5"/><text x="890.0" y="388.0" font-size="23" fill="#8668a5" text-anchor="middle" class="bold">CE → loss</text><line x1="800" y1="380" x2="770" y2="380" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="560" y="340" width="200" height="80" rx="9" fill="#e6efe5" stroke="#4c8164" stroke-width="1.5"/><text x="660.0" y="371.0" font-size="23" fill="#4c8164" text-anchor="middle" class="bold">backward()</text><text x="660.0" y="405.0" font-size="23" fill="#302c2a" text-anchor="middle">step()</text><text x="30" y="347" font-size="24" fill="#302c2a" text-anchor="start" class="bold">每列预测下一个 Token。</text><text x="30" y="384" font-size="23" fill="#706760" text-anchor="start">输入取自真实前缀，仍使用 Causal Mask。</text><text x="500" y="450" font-size="23" fill="#706760" text-anchor="middle">左侧列出第一个样本；右侧形状包含两个样本，词表大小为 6。</text>
</svg>
