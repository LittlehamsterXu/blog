<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">位置编码：Token 相同，注意力权重也可以不同</title>
<desc id="desc">同一个内容向量复制到三个位置，Q、K、V使用恒等投影，无Mask且未训练。未加入位置编码时，注意力每一行都是三分之一；加入正弦位置编码后，三行分别约为0.333、0.405、0.261；0.221、0.426、0.352；0.149、0.369、0.482。图中两张矩阵共用0到1线性色标，数字保留三位小数。数值来自公开results.json的additional_checks.positions。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#706760"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">位置编码：Token 相同，注意力权重也可以不同</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">相同 Token · 恒等 Q/K/V · 无 Mask · 未训练，仅改变是否加入正弦位置编码。</text>
