<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">连续的方向变了</title>
<desc id="desc">32乘32转置的两张局部网格都按values的逻辑坐标row、col排列，格内数字是指针相对基址的元素偏移。Load访问X加32乘row加col，沿col连续。Store访问Y加32乘col加row，沿values的row连续，对应Y的列方向。逻辑坐标(1,2)的同一个value来自输入X[1,2]，写到输出Y[2,1]，元素偏移分别为34和65。布局转换改变线程持有的元素，转置后的存储位置由输出地址公式给出。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}.mono{font-family:Consolas,"DejaVu Sans Mono",monospace}</style>
