<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1110" viewBox="0 0 680 1110" role="img" aria-labelledby="title desc">
<title id="title">每线程都是四个值</title>
<desc id="desc">一个 warp、128 个元素的布局转换。SRC 的 sizePerThread 为 2，基本覆盖 64 个元素，需要重复两轮；两轮指布局分组，不表示执行先后。lane 0 的 slot 0 到 3 是 0、1、64、65。DST 的 sizePerThread 为 4，一轮覆盖 128 个元素，lane 16 的 slot 0 到 3 是 64、65、66、67。x[64] 从 lane 0 slot 2 交给同一 warp 的 lane 16 slot 0，这次编译使用 Shuffle，不使用 shared memory。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#706760"/></marker></defs>
<style>text{font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;font-weight:400} .mono{font-family:Consolas,'DejaVu Sans Mono',monospace} .bold{font-weight:650}</style>
<rect width="680" height="1110" rx="16" fill="#fbf7f0"/>
<text x="36" y="48" font-size="29" fill="#302c2a" text-anchor="start" class="bold">每线程都是四个值</text>
<text x="36" y="82" font-size="22" fill="#706760" text-anchor="start" class="">1 warp · N = 128 · SRC [2] → DST [4]</text>
<rect x="36" y="111" width="608" height="370" rx="9" fill="white" stroke="#d9cec3" stroke-width="1.5"/>
<text x="58" y="149" font-size="24" fill="#427e9a" text-anchor="start" class="bold">SRC：先铺 64 个，再重复一轮</text>
<text x="58" y="181" font-size="22" fill="#302c2a" text-anchor="start" class="">2 × 32 × 1 = 64；128 ÷ 64 = 2 轮</text>
<text x="58" y="220" font-size="20" fill="#706760" text-anchor="start" class="">Lane</text>
<text x="288" y="220" font-size="20" fill="#427e9a" text-anchor="middle" class="">第一轮</text>
<text x="508" y="220" font-size="20" fill="#8668a5" text-anchor="middle" class="">第二轮</text>
