<text x="332" y="251" font-size="18" fill="#706760" text-anchor="middle" class="">slot 1</text>
<text x="442" y="251" font-size="18" fill="#706760" text-anchor="middle" class="">slot 2</text>
<text x="552" y="251" font-size="18" fill="#706760" text-anchor="middle" class="">slot 3</text>
