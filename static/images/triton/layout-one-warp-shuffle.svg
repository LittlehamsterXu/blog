<text x="58" y="548" font-size="24" fill="#302c2a" text-anchor="start" class="bold">只追 x[64]</text>
<text x="58" y="585" font-size="23" fill="#302c2a" text-anchor="start" class="">lane 0 · slot 2</text>
<line x1="269" y1="578" x2="366" y2="578" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="585" font-size="23" fill="#302c2a" text-anchor="start" class="">lane 16 · slot 0</text>
<text x="58" y="629" font-size="23" fill="#427e9a" text-anchor="start" class="bold">同一 warp 内换手：Shuffle</text>
<rect x="36" y="695" width="608" height="330" rx="9" fill="white" stroke="#d9cec3" stroke-width="1.5"/>
<text x="58" y="733" font-size="24" fill="#4c8164" text-anchor="start" class="bold">DST：一轮就覆盖 128 个</text>
<text x="58" y="765" font-size="22" fill="#302c2a" text-anchor="start" class="">4 × 32 × 1 = 128；不需要重复</text>
