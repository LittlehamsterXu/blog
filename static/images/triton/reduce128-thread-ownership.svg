<line x1="36" y1="991" x2="644" y2="991" stroke="#d9cec3" stroke-width="1.5"/>
<text x="36" y="1026" font-size="23" fill="#302c2a" text-anchor="start" class="bold">128 个逻辑位置 ≠ 必须启动 128 个线程</text>
<text x="36" y="1056" font-size="20" fill="#706760" text-anchor="start" class="">两种分工都覆盖同一批输入，归约的通信随之改变。</text>
