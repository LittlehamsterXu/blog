<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" role="img" aria-labelledby="title desc">
<title id="title">128 个位置，几条线程？</title>
<desc id="desc">reduce128 的输入始终是 x[0] 到 x[127]。一个 warp 用 32 个线程，每个 lane 持有连续四个值，i=4*lane+slot。四个 warp 用 128 个线程，每个线程持有一个值，i=32*warp+lane。tl.arange 的 128 是逻辑位置的数量，不是线程数量。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#706760"/></marker></defs>
<style>text{font-family:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;font-weight:400} .mono{font-family:Consolas,'DejaVu Sans Mono',monospace} .bold{font-weight:650}</style>
<rect width="680" height="1080" rx="16" fill="#fbf7f0"/>
<text x="36" y="48" font-size="29" fill="#302c2a" text-anchor="start" class="bold">128 个位置，几条线程？</text>
<text x="36" y="82" font-size="22" fill="#706760" text-anchor="start" class="">同一个 reduce128，只改 num_warps</text>
<rect x="36" y="110" width="608" height="65" rx="9" fill="#fae4da" stroke="#e18568" stroke-width="1.5"/>
<text x="340" y="151" font-size="25" fill="#302c2a" text-anchor="middle" class="bold">逻辑 tile：x[0] … x[127]</text>
<line x1="340" y1="185" x2="340" y2="218" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="238" width="608" height="342" rx="9" fill="white" stroke="#d9cec3" stroke-width="1.5"/>
<text x="58" y="275" font-size="25" fill="#427e9a" text-anchor="start" class="bold">1 warp = 32 threads</text>
<text x="58" y="308" font-size="22" fill="#302c2a" text-anchor="start" class="">每个 lane 拿连续 4 个值</text>
