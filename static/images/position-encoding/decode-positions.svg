<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">增量生成：新 Token 的位置接着历史走</title>
<desc id="desc">Prefill处理位置0到3，缓存已有四个Token。随后一次仅输入一个Token，输入shape为1乘1，其位置编号为4；下一步位置编号为5。输入块长度与Token在序列中的位置分别表示不同信息。下方把每次位置重置为0作为对照。位置嵌入或RoPE的位置编号以及因果Mask中的Query与Key位置，均应延续历史偏移。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="480" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">增量生成：新 Token 的位置接着历史走</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">输入块的长度是 1，Token 在序列中的编号继续向后。</text>
<text x="30" y="137" font-size="27" fill="#427e9a" text-anchor="start" class="bold">Prefill</text><rect x="195" y="110" width="80" height="58" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="235.0" y="147.0" font-size="28" fill="#427e9a" text-anchor="middle" class="bold">0</text><rect x="300" y="110" width="80" height="58" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="340.0" y="147.0" font-size="28" fill="#427e9a" text-anchor="middle" class="bold">1</text><rect x="405" y="110" width="80" height="58" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="445.0" y="147.0" font-size="28" fill="#427e9a" text-anchor="middle" class="bold">2</text><rect x="510" y="110" width="80" height="58" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="550.0" y="147.0" font-size="28" fill="#427e9a" text-anchor="middle" class="bold">3</text><text x="675" y="147" font-size="25" fill="#706760" text-anchor="start">历史长度 past_len = 4</text><text x="30" y="240" font-size="26" fill="#4c8164" text-anchor="start" class="bold">逐步生成</text><rect x="195" y="200" width="310" height="98" rx="10" fill="#e6efe5" stroke="#4c8164" stroke-width="1.6"/><text x="350.0" y="241.0" font-size="23" fill="#4c8164" text-anchor="middle" class="bold">新输入 [1, 1] → 位置 4</text><text x="350.0" y="273.0" font-size="23" fill="#302c2a" text-anchor="middle">positions = [4]</text><text x="350" y="329" font-size="23" fill="#706760" text-anchor="middle">历史长度 4，本轮新增 1</text><rect x="615" y="200" width="310" height="98" rx="10" fill="#e6efe5" stroke="#4c8164" stroke-width="1.6"/><text x="770.0" y="241.0" font-size="23" fill="#4c8164" text-anchor="middle" class="bold">新输入 [1, 1] → 位置 5</text><text x="770.0" y="273.0" font-size="23" fill="#302c2a" text-anchor="middle">positions = [5]</text><text x="770" y="329" font-size="23" fill="#706760" text-anchor="middle">历史长度 5，本轮新增 1</text><line x1="515" y1="249" x2="600" y2="249" stroke="#4c8164" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="407" font-size="24" fill="#bf633f" text-anchor="start" class="bold">每步重置</text><rect x="195" y="369" width="125" height="55" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="257.5" y="404.5" font-size="27" fill="#bf633f" text-anchor="middle" class="bold">0</text><line x1="330" y1="396" x2="385" y2="396" stroke="#bf633f" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="369" width="125" height="55" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="457.5" y="404.5" font-size="27" fill="#bf633f" text-anchor="middle" class="bold">0</text><text x="550" y="406" font-size="23" fill="#706760" text-anchor="start">输入长度都为 1，历史位置却在增长。</text><text x="500" y="462" font-size="23" fill="#706760" text-anchor="middle">位置嵌入 / RoPE 与因果 Mask，都要延续同一段历史位置。</text>
</svg>
