<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">位置向量在哪里加入？</title>
<desc id="desc">输入加法位置编码：Token ID与Position ID分别查表，得到同形状T乘D的向量后逐元素相加，再投影生成Q和K，最后计算T乘T的匹配分数。示意两个相同内容Token编号7，位置分别0和1。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">位置向量在哪里加入？</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">内容与位置各查一张表，得到相同宽度的向量后相加。</text>
<rect x="30" y="120" width="150" height="80" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="105.0" y="152.0" font-size="26" fill="#427e9a" text-anchor="middle" class="bold">Token IDs</text><text x="105.0" y="184.0" font-size="23" fill="#302c2a" text-anchor="middle">[7, 7]</text><rect x="225" y="120" width="230" height="80" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="340.0" y="152.0" font-size="25" fill="#427e9a" text-anchor="middle" class="bold">Token Embedding</text><text x="340.0" y="184.0" font-size="23" fill="#302c2a" text-anchor="middle">[T, D]</text><rect x="30" y="260" width="150" height="80" rx="10" fill="#eee7f4" stroke="#8668a5" stroke-width="1.6"/><text x="105.0" y="292.0" font-size="22" fill="#8668a5" text-anchor="middle" class="bold">Position IDs</text><text x="105.0" y="324.0" font-size="23" fill="#302c2a" text-anchor="middle">[0, 1]</text><rect x="225" y="260" width="230" height="80" rx="10" fill="#eee7f4" stroke="#8668a5" stroke-width="1.6"/><text x="340.0" y="292.0" font-size="22" fill="#8668a5" text-anchor="middle" class="bold">Position Embedding</text><text x="340.0" y="324.0" font-size="23" fill="#302c2a" text-anchor="middle">[T, D]</text><line x1="180" y1="160" x2="215" y2="160" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="180" y1="300" x2="215" y2="300" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 160 H480 L499 206" fill="none" stroke="#706760" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M455 300 H480 L499 234" fill="none" stroke="#706760" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="510" cy="220" r="23" fill="#fbf7f0" stroke="#706760" stroke-width="2"/><text x="510" y="230" font-size="34" fill="#706760" text-anchor="middle">+</text><line x1="533" y1="220" x2="565" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="175" width="150" height="90" rx="10" fill="#e6efe5" stroke="#4c8164" stroke-width="1.6"/><text x="650.0" y="212.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">X = e + p</text><text x="650.0" y="244.0" font-size="23" fill="#302c2a" text-anchor="middle">[T, D]</text><line x1="725" y1="220" x2="760" y2="220" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="175" width="200" height="90" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="870.0" y="212.0" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">Linear → Q、K</text><text x="870.0" y="244.0" font-size="23" fill="#302c2a" text-anchor="middle">[T, d]</text><line x1="870" y1="265" x2="870" y2="307" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><rect x="770" y="320" width="200" height="65" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="870.0" y="360.5" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">scores [T, T]</text><text x="30" y="399" font-size="24" fill="#302c2a" text-anchor="start">同样的 Token 内容 e₇，分别加上位置 p₀ 和 p₁。</text><text x="500" y="443" font-size="26" fill="#4c8164" text-anchor="middle" class="bold">X₀ = e₇ + p₀       ·       X₁ = e₇ + p₁</text>
</svg>
