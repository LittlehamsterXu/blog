<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">绝对坐标与相对距离</title>
<desc id="desc">两组位置编号3和5、13和15均相隔2。下方对比两种位置注入方式：输入加法先将内容与位置相加，再投影为Q和K；RoPE先从内容投影得到Q和K，再按各自位置旋转，最后计算分数。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="460" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">绝对坐标与相对距离</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">整体向后移动十个位置，两者之间的距离仍然是 2。</text>
<text x="30" y="134" font-size="24" fill="#706760" text-anchor="start">位置编号</text><line x1="205" y1="135" x2="415" y2="135" stroke="#9b8f83" stroke-width="2"/><circle cx="205" cy="135" r="7" fill="#427e9a"/><circle cx="415" cy="135" r="7" fill="#bf633f"/><text x="205" y="115" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">3</text><text x="415" y="115" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">5</text><text x="310" y="168" font-size="23" fill="#706760" text-anchor="middle">相隔 2 个位置</text><line x1="640" y1="135" x2="850" y2="135" stroke="#9b8f83" stroke-width="2"/><circle cx="640" cy="135" r="7" fill="#427e9a"/><circle cx="850" cy="135" r="7" fill="#bf633f"/><text x="640" y="115" font-size="24" fill="#427e9a" text-anchor="middle" class="bold">13</text><text x="850" y="115" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">15</text><text x="745" y="168" font-size="23" fill="#706760" text-anchor="middle">相隔 2 个位置</text><line x1="30" y1="190" x2="970" y2="190" stroke="#d9cec3" stroke-width="2"/><text x="30" y="245" font-size="25" fill="#8668a5" text-anchor="start" class="bold">输入加法</text><rect x="190" y="212" width="200" height="64" rx="10" fill="#eee7f4" stroke="#8668a5" stroke-width="1.6"/><text x="290.0" y="252.0" font-size="27" fill="#8668a5" text-anchor="middle" class="bold">x + p</text><rect x="445" y="212" width="235" height="64" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="562.5" y="252.0" font-size="25" fill="#427e9a" text-anchor="middle" class="bold">投影 → Q、K</text><rect x="745" y="212" width="225" height="64" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="857.5" y="252.0" font-size="24" fill="#bf633f" text-anchor="middle" class="bold">QKᵀ → scores</text><line x1="390" y1="244" x2="435" y2="244" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="244" x2="735" y2="244" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="350" font-size="27" fill="#4c8164" text-anchor="start" class="bold">RoPE</text><rect x="190" y="317" width="200" height="64" rx="10" fill="#e3f0f4" stroke="#427e9a" stroke-width="1.6"/><text x="290.0" y="357.0" font-size="26" fill="#427e9a" text-anchor="middle" class="bold">x → Q、K</text><rect x="445" y="317" width="235" height="64" rx="10" fill="#e6efe5" stroke="#4c8164" stroke-width="1.6"/><text x="562.5" y="357.0" font-size="24" fill="#4c8164" text-anchor="middle" class="bold">按位置 m、n 旋转</text><rect x="745" y="317" width="225" height="64" rx="10" fill="#fae4da" stroke="#bf633f" stroke-width="1.6"/><text x="857.5" y="357.0" font-size="23" fill="#bf633f" text-anchor="middle" class="bold">Q′K′ᵀ → scores</text><line x1="390" y1="349" x2="435" y2="349" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="349" x2="735" y2="349" stroke="#706760" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="438" font-size="24" fill="#706760" text-anchor="middle">位置既可以进入输入向量，也可以进入投影后的 Q、K。</text>
</svg>
