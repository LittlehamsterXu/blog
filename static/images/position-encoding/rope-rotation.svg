<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">RoPE：旋转位置，保留相对角度</title>
<desc id="desc">二维标准旋转矩阵为cos角负sin角、sin角cos角。固定原始Query和Key，分别旋转m乘theta与n乘theta后，点积等于q转置乘相对旋转R的n减m次方再乘k。图中虚线为原向量，实线为分别旋转后的向量，两个向量的长度各自保持。给m和n同时增加相同偏移后，相对旋转角保持不变。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;font-weight:400}.bold{font-weight:650}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 7 3.5 0 7Z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="470" rx="16" fill="#fbf7f0"/>
<text x="30" y="44" font-size="29" fill="#302c2a" text-anchor="start" class="bold">RoPE：旋转位置，保留相对角度</text>
<text x="30" y="82" font-size="23" fill="#706760" text-anchor="start">先看一对二维坐标，再把同样的操作用于每个特征对。</text>
<line x1="83" y1="272" x2="403" y2="272" stroke="#9b8f83" stroke-width="2" marker-end="url(#arrow)"/><line x1="238" y1="407" x2="238" y2="113" stroke="#9b8f83" stroke-width="2" marker-end="url(#arrow)"/><circle cx="238" cy="272" r="116" fill="none" stroke="#d9cec3" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="238" y1="272" x2="351.47" y2="247.88" stroke="#427e9a" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="360.46512168512146" y="256.8822438651399" font-size="28" fill="#427e9a" text-anchor="start" class="bold">q</text><line x1="238" y1="272" x2="307.81" y2="179.36" stroke="#427e9a" stroke-width="2.8" marker-end="url(#arrow)"/><text x="315.81054268563764" y="174.35828083451403" font-size="28" fill="#427e9a" text-anchor="start" class="bold">q′</text><line x1="238" y1="272" x2="250.25" y2="184.86" stroke="#bf633f" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="255.24723288448575" y="176.8564099507418" font-size="28" fill="#bf633f" text-anchor="start" class="bold">k</text><line x1="238" y1="272" x2="167.72" y2="219.04" stroke="#bf633f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="131.72007511583823" y="210.04027796261977" font-size="28" fill="#bf633f" text-anchor="start" class="bold">k′</text><path d="M307.45 257.24 A71 71 0 0 0 280.73 215.30" fill="none" stroke="#427e9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M245.65 217.54 A55 55 0 0 0 194.08 238.90" fill="none" stroke="#bf633f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="328" y="235" font-size="24" fill="#427e9a" text-anchor="middle">mθ</text><text x="187" y="176" font-size="24" fill="#bf633f" text-anchor="middle">nθ</text><text x="238" y="435" font-size="22" fill="#706760" text-anchor="middle">虚线：原向量；实线：旋转后</text><line x1="463" y1="112" x2="463" y2="443" stroke="#d9cec3" stroke-width="2"/><text x="505" y="145" font-size="27" fill="#4c8164" text-anchor="start" class="bold">位置决定旋转角度</text><text x="505" y="191" font-size="27" fill="#427e9a" text-anchor="start" class="bold">q′ = R(mθ) q</text><text x="505" y="233" font-size="27" fill="#bf633f" text-anchor="start" class="bold">k′ = R(nθ) k</text><rect x="495" y="262" width="475" height="82" rx="10" fill="#e6efe5" stroke="#4c8164" stroke-width="1.6"/><text x="732.5" y="311.0" font-size="27" fill="#4c8164" text-anchor="middle" class="bold">(Rₘq)ᵀ(Rₙk) = qᵀ Rₙ₋ₘ k</text><text x="505" y="385" font-size="24" fill="#706760" text-anchor="start">固定原始 q、k，共同平移位置，</text><text x="505" y="424" font-size="24" fill="#706760" text-anchor="start">旋转角度的差保持不变。</text>
</svg>
