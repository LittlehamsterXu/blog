baseURL: "https://blog.little-hamster-xu.workers.dev/"
locale: zh-cn
timeZone: Asia/Shanghai
defaultContentLanguage: zh
title: Little Hamster 的博客
theme: [PaperMod]
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\\['
              - '\\]'
            - - '$$'
              - '$$'
          inline:
            - - '\\('
              - '\\)'
  highlight:
    noClasses: false

params:
  env: production
  description: 记录技术实践、学习过程与日常想法
  author: LittlehamsterXu
  keywords:
    - Hugo
    - 技术博客
    - 编程
  math: false
  schema:
    publisherType: Person
    sameAs:
      - https://github.com/LittlehamsterXu
  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  mainSections: [posts]
  ShowReadingTime: true
  ShowWordCount: true
  ShowFullTextinRSS: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: 欢迎来到我的博客
    Content: 记录技术实践、学习过程与日常想法。
  footer:
    text: "Technical notes · Little Hamster"
  socialIcons:
    - name: github
      url: https://github.com/LittlehamsterXu

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: about
      name: 关于
      url: /about/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
