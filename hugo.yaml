baseURL: "https://blog.little-hamster-xu.workers.dev/"
locale: zh-cn
timeZone: Asia/Shanghai
defaultContentLanguage: zh
title: LittleHamster Xu 的博客
theme: [PaperMod]
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      extras:
        mark:
          enable: true
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\['
              - '\]'
            - - '$$'
              - '$$'
          inline:
            - - '\('
              - '\)'
  highlight:
    noClasses: true

params:
  env: production
  description: 记录技术实践、学习过程与日常想法
  author: LittleHamster Xu
  keywords:
    - Hugo
    - 技术博客
    - 编程
  math: false
  schema:
    publisherType: Person
    sameAs:
      - https://github.com/LittlehamsterXu
  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  mainSections: [posts]
  ShowReadingTime: true
  ShowWordCount: true
  ShowFullTextinRSS: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true
  cover:
    hiddenInSingle: true
  label:
    text: LittleHamster_Xu' Blog
    icon: "images/avatar.png"
    iconHeight: 32
  assets:
    favicon: "images/avatar.png"
    favicon16x16: "images/avatar.png"
    favicon32x32: "images/avatar.png"
    apple_touch_icon: "images/avatar.png"
    theme_color: "#e18568"
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.3
    minMatchCharLength: 1
    keys:
      - title
      - permalink
      - summary
      - content
      - tags
  homeInfoParams:
    Title: 欢迎来到我的博客
    Content: "## 记录技术，也记录折腾。"
  footer:
    text: "Technical notes · LittleHamster Xu"
  socialIcons:
    - name: github
      url: https://github.com/LittlehamsterXu

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40
