baseURL: "https://blog.little-hamster-xu.workers.dev/"
locale: zh-cn
timeZone: Asia/Shanghai
defaultContentLanguage: zh
title: Little Hamster 的博客
theme: [PaperMod]
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '\\['
              - '\\]'
            - - '$$'
              - '$$'
          inline:
            - - '\\('
              - '\\)'
  highlight:
    noClasses: false

params:
  env: production
  description: 记录技术实践、工具探索与日常思考
  author: LittlehamsterXu
  keywords:
    - Systems Security
    - Compiler Security
    - AI Compiler
    - Reverse Engineering
    - Pwn
    - CTF
  math: false
  schema:
    publisherType: Person
    sameAs:
      - https://github.com/LittlehamsterXu
  defaultTheme: auto
  disableThemeToggle: false
  DateFormat: "2006-01-02"
  mainSections: [posts]
  ShowReadingTime: true
  ShowWordCount: true
  ShowFullTextinRSS: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  homeInfoParams:
    Title: 欢迎来到我的博客
    Content: 记录技术实践、工具探索与日常思考。
  footer:
    text: "Systems Security · Compiler Security · AI Compilers"
  socialIcons:
    - name: github
      url: https://github.com/LittlehamsterXu

menu:
  main:
    - identifier: research
      name: 研究
      url: /research/
      weight: 10
    - identifier: security
      name: 安全
      url: /security/
      weight: 20
    - identifier: projects
      name: 项目
      url: /projects/
      weight: 30
    - identifier: contributions
      name: 贡献
      url: /contributions/
      weight: 40
    - identifier: posts
      name: 博客
      url: /posts/
      weight: 50
    - identifier: about
      name: 关于
      url: /about/
      weight: 60
    - identifier: search
      name: 搜索
      url: /search/
      weight: 70
